<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastro - SENAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}"></head>

<body>

<div class="header">
    <img src="{{ url_for('static', filename='img/senai.png') }}" alt="SENAI" class="logo">
</div>

<div class="container">

    <h1>📝 Criar Conta</h1>

    <p>
        Cadastre-se para acessar o sistema de monitoramento
    </p>

    <form method="POST">

        <input type="text" name="nome" placeholder="Digite seu nome" required>

        <input type="email" name="email" placeholder="Digite seu email" required>

        <input type="password" name="senha" placeholder="Digite sua senha" required>

        <button type="submit">
            Criar Conta
        </button>

        {% if erro %}
    <div class="erro">
        {{ erro }}
    </div>
{% endif %}
    </form>

    <a href="/login" class="cadastro-link">
        Já possui conta? Fazer login
    </a>

    <div class="status">
        Sistema SENAI Online
        <span class="pulse"></span>
    </div>

</div>

</body>
</html>
